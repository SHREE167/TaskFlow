<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow - A lightweight, responsive task manager web application built with HTML5, CSS3, and JavaScript.">
  <title>TaskFlow — Responsive Task Manager</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Toast Notification for Form Validation & Alerts -->
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </span>
        <h1>TaskFlow</h1>
      </div>
      <button id="themeToggle" class="theme-btn" title="Toggle light/dark theme" aria-label="Toggle theme">
        <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <!-- Statistics Panel -->
    <section class="stats-card-panel" aria-label="Task statistics">
      <div class="stats">
        <div class="stat-card">
          <span class="stat-num" id="statTotal">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="statPending">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="statDone">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card">
          <span class="stat-num stat-overdue" id="statOverdue">0</span>
          <span class="stat-label">Overdue</span>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress-track">
          <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
        </div>
        <span class="progress-text" id="progressText">0% complete</span>
      </div>
    </section>

    <!-- Task Entry Form -->
    <section class="form-section" id="formSection" aria-label="Task input form">
      <form id="taskForm" class="task-form">
        <div class="form-row-main">
          <input
            type="text"
            id="title"
            name="title"
            placeholder="What needs to be done?"
            maxlength="80"
            autocomplete="off"
            aria-label="Task title"
          />
        </div>
        <div class="form-row">
          <div class="input-group date-group">
            <input
              type="date"
              id="due"
              name="due"
              aria-label="Due date"
            />
          </div>
          <div class="input-group">
            <select id="priority" name="priority" aria-label="Task priority">
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="input-group">
            <select id="category" name="category" aria-label="Task category">
              <option value="Personal" selected>Personal</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
              <option value="Shopping">Shopping</option>
            </select>
          </div>
          <div class="btn-group">
            <button type="submit" id="submitBtn" class="btn btn-primary">Add Task</button>
            <button type="button" id="cancelEditBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
          </div>
        </div>
      </form>
    </section>

    <!-- Search, Filter & Sort Toolbar -->
    <section class="toolbar" aria-label="Task filters and search">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="search"
          placeholder="Search tasks..."
          autocomplete="off"
          aria-label="Search tasks"
        />
      </div>

      <div class="filter-group" id="filterButtons" role="radiogroup" aria-label="Filter tasks">
        <button type="button" class="filter-btn active" data-filter="all" role="radio" aria-checked="true">All</button>
        <button type="button" class="filter-btn" data-filter="active" role="radio" aria-checked="false">Pending</button>
        <button type="button" class="filter-btn" data-filter="completed" role="radio" aria-checked="false">Completed</button>
      </div>

      <div class="sort-box">
        <select id="sortBy" aria-label="Sort tasks">
          <option value="newest" selected>Newest first</option>
          <option value="due">Due date</option>
          <option value="priority">Priority</option>
        </select>
      </div>
    </section>

    <!-- Task List -->
    <main class="list-section">
      <ul id="taskList" class="task-list" aria-label="Task list"></ul>

      <footer class="list-footer">
        <span id="tasksLeft" class="tasks-left">0 tasks left</span>
        <button type="button" id="clearDone" class="btn-text">Clear completed</button>
      </footer>
    </main>

    <!-- App Credits / Footer -->
    <footer class="app-credits">
      <p>TaskFlow &bull; Web Development Internship Project &bull; Vault of Codes</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
